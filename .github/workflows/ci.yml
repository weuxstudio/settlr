name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # $env/static/public is resolved at build time, so the two values the app
      # imports must be present here as well, otherwise the build step fails.
      PUBLIC_ARC_NETWORK: mainnet
      PUBLIC_ARC_RPC_URL: https://rpc.mainnet.arc.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
